name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Die Tests laufen ohne Netz gegen gespeicherte Antworten; Referenzdaten werden nicht importiert.
      - name: Bauen
        run: dotnet build -c Release

      - name: Testen
        run: dotnet test -c Release --no-build
